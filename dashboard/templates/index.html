<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DEXtrader-V5 Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
/* ----------------------------------------------------------
   GLOBAL FUTURISTIC THEME — Neon Cyber Grid (Blue/Cyan Glow)
----------------------------------------------------------- */
body {
    margin: 0;
    padding: 0;
    background: #02040a;
    color: #d6f1ff;
    font-family: "Inter", sans-serif;
    overflow-x: hidden;
}

/* Animated cyber grid background */
body::before {
    content: "";
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: linear-gradient(#0ff2, #0ff2),
                url('https://i.ibb.co/9HpkZKw/grid-dark.png');
    background-size: 4px 4px, cover;
    opacity: 0.17;
    animation: gridMove 12s linear infinite;
    z-index: -1;
}

@keyframes gridMove {
    0% { background-position: 0 0, center; }
    100% { background-position: 0 100px, center; }
}

/* Container */
.container {
    max-width: 900px;
    margin: auto;
    padding: 20px;
}

/* Hologram headers */
h1, h2, h3 {
    font-family: "Orbitron", sans-serif;
    text-align: center;
    margin: 10px 0;
    letter-spacing: 1px;
    text-shadow: 0 0 8px #0ff;
}

h1 { font-size: 2.1rem; }
h2 { font-size: 1.5rem; }

/* Hologram Cards */
.card {
    background: rgba(0, 25, 35, 0.45);
    border: 1px solid rgba(0, 255, 255, 0.3);
    box-shadow: 0 0 15px #0ff3;
    border-radius: 14px;
    padding: 18px;
    margin: 15px 0;
    backdrop-filter: blur(8px);
}

/* Status text */
#botStatus {
    font-size: 1.2rem;
    text-align: center;
    font-family: "Orbitron", sans-serif;
    color: #6efaff;
    text-shadow: 0 0 8px #0ff;
}

/* Neon Buttons */
button {
    font-family: "Orbitron", sans-serif;
    font-size: 0.95rem;
    padding: 12px 20px;
    border: 1px solid #0ff;
    background: transparent;
    color: #affcff;
    border-radius: 10px;
    cursor: pointer;
    transition: 0.25s;
    width: 100%;
    margin: 8px 0;
    text-shadow: 0 0 6px #0ff;
    box-shadow: 0 0 10px #0ff3 inset;
}

button:hover {
    box-shadow: 0 0 14px #0ff, 0 0 20px #0ff6 inset;
    transform: translateY(-2px);
}

button:active {
    transform: scale(0.95);
}

/* Chart block */
#priceChart {
    width: 100%;
    height: 300px;
}

/* Logs Box */
#logOutput {
    background: rgba(0,15,20,0.55);
    border: 1px solid #0ff3;
    box-shadow: 0 0 12px #0ff4 inset;
    border-radius: 12px;
    padding: 14px;
    height: 280px;
    overflow-y: auto;
    white-space: pre-wrap;      /* <-- WRAPS LONG LOGS */
    word-wrap: break-word;      /* <-- BREAK LONG STRINGS */
    font-size: 0.9rem;
    line-height: 1.4rem;
}

/* Inputs */
input, select {
    width: 100%;
    padding: 10px;
    margin: 6px 0;
    border-radius: 8px;
    border: 1px solid #0ff4;
    background: rgba(0, 20, 30, 0.65);
    color: #d2faff;
    font-size: 0.95rem;
    outline: none;
}

input:focus, select:focus {
    box-shadow: 0 0 8px #0ff8;
}

/* Mobile responsiveness */
@media (max-width: 600px) {
    h1 { font-size: 1.6rem; }
    #priceChart { height: 230px; }
    button { font-size: 0.85rem; padding: 10px; }
}

</style>
</head>

<body>
<div class="container">

    <h1>DEXtrader V5 Dashboard</h1>

    <!-- Bot Status -->
    <div class="card">
        <h2>Bot Status</h2>
        <div id="botStatus">Loading...</div>
    </div>

    <!-- Strategy Selector -->
    <div class="card">
        <h2>Select Strategy</h2>
        <select id="strategySelect">
            <option value="asset-balancer">Asset Balancer</option>
            <option value="dca-grid">DCA Grid</option>
            <option value="uniswap-v3">Uniswap V3 Strategy</option>
        </select>
        <button onclick="updateStrategy()">Apply Strategy</button>
    </div>

    <!-- Price Chart -->
    <div class="card">
        <h2>Live Price Chart</h2>
        <canvas id="priceChart"></canvas>
    </div>

    <!-- Controls -->
    <div class="card">
        <h2>Bot Controls</h2>
        <button onclick="startBot()">Start Bot</button>
        <button onclick="stopBot()" style="border-color:#ff8080; color:#ffb7b7; box-shadow:0 0 10px #ff000033 inset;">Stop Bot</button>
    </div>

    <!-- Logs -->
    <div class="card">
        <h2>Runtime Logs</h2>
        <div id="logOutput">Initializing...</div>
    </div>

</div>

<!-- ChartJS -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!-- Your existing dashboard JS — stays untouched -->
<script src="static/dashboard.js"></script>

</body>
</html>
